services:
  - type: web
    name: nanobrowser-backend
    env: node
    rootDir: .
    buildCommand: pnpm install && pnpm -F @nanobrowser/backend build
    startCommand: pnpm -F @nanobrowser/backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Firebase Realtime Database (shared JobForm Automator project; data lives under NANOBROWSER_RTDB_ROOT)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: NANOBROWSER_RTDB_ROOT
        value: nanobrowser
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_DEFAULT_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGIN
        value: '*'
