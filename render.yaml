services:
  - type: web
    name: nanobrowser-backend
    runtime: node
    plan: starter

    rootDir: .

    buildCommand: pnpm install --frozen-lockfile && pnpm -F @nanobrowser/backend build

    startCommand: pnpm -F @nanobrowser/backend start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: LLM_PROVIDER
        value: gemini

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false

      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false

      - key: FIREBASE_DATABASE_URL
        sync: false

      - key: FIREBASE_WEB_API_KEY
        sync: false

      - key: NANOBROWSER_RTDB_ROOT
        value: nanobrowser

      - key: JWT_SECRET
        generateValue: true

      - key: CORS_ORIGIN
        sync: false