
services:
  - type: web
    name: nanobrowser-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @nanobrowser/backend build
    startCommand: pnpm -F @nanobrowser/backend start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: CORS_ORIGIN
        sync: false

      - key: LOG_LEVEL
        value: info

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: LLM_PROVIDER
        value: gemini

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash

      - key: LLM_DEFAULT_MODEL
        value: gemini-3.5-flash

      - key: AWS_BEDROCK_API_KEY
        sync: false

      - key: AWS_BEDROCK_REGION
        value: us-east-1

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: NANOBROWSER_RTDB_ROOT
        value: nanobrowser

      - key: FIREBASE_PROJECT_ID
        sync: false

      - key: FIREBASE_DATABASE_URL
        sync: false

      - key: FIREBASE_STORAGE_BUCKET
        sync: false

      - key: FIREBASE_WEB_API_KEY
        sync: false

      - key: FIREBASE_ADMIN_CLIENT_EMAIL
        sync: false

      - key: FIREBASE_ADMIN_PRIVATE_KEY
        sync: false

      - key: JWT_SECRET
        generateValue: true
